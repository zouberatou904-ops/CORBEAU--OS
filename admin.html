<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Corbeau – Boss</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="sheet" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="x" type="button" data-act="close" aria-label="Fermer"></button>
    <div class="sheet-body"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="pick" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  var C = window.C, sb = C.sb, $ = C.$, esc = C.esc, F = C.F, svg = C.svg, ICON = C.ICON, toast = C.toast, fdate = C.fdate;
  var state = { view: "login", tab: "commandes", commandes: [], versements: [], retraits: [], membres: [], produits: [] };

  $(".x").innerHTML = svg(ICON.close, 22);

  function msg(e) {
    var m = (e && e.message) || "";
    if (/Failed to fetch|NetworkError|network/i.test(m)) return "Connexion impossible. Vérifie ton internet.";
    if (/bucket not found/i.test(m)) return "Stockage des photos non activé. Lance d'abord photos.sql dans Supabase.";
    if (/mime|too large|payload/i.test(m)) return "Photo refusée (trop lourde ou mauvais format).";
    return m || "Une erreur est survenue.";
  }
  function setErr(t) { var e = $("#err"); if (e) e.textContent = t || ""; }
  function busy(form, on) { var b = $("button[type=submit]", form); if (b) b.disabled = on; }
  function intl(num) {
    var d = String(num || "").replace(/\D/g, "");
    if (!d) return "";
    return d.indexOf("229") === 0 && d.length > 10 ? d : "229" + d;
  }

  /* ---------- chargement ---------- */
  async function loadAll() {
    var a = await Promise.all([
      sb.from("commandes").select("id,quantite,cree_le,membres(nom),produits(nom)").eq("statut", "demandee").order("cree_le"),
      sb.from("versements").select("id,montant,operateur,reference,cree_le,membres(nom)").eq("statut", "annonce").order("cree_le"),
      sb.from("retraits").select("id,montant,operateur,numero,cree_le,membres(nom)").eq("statut", "en_attente").order("cree_le"),
      sb.from("membres_soldes").select("*").order("cree_le", { ascending: false }),
      sb.from("produits").select("*").order("cree_le", { ascending: false })
    ]);
    state.commandes = a[0].data || [];
    state.versements = a[1].data || [];
    state.retraits = a[2].data || [];
    state.membres = a[3].data || [];
    state.produits = a[4].data || [];
  }

  /* ---------- écrans ---------- */
  function loginHTML(refus) {
    return '<div class="wrap pad"><div class="mini" style="width:96px;height:66px"><img src="logo.png" alt="Corbeau" style="width:96px;height:96px"></div>' +
      '<h1 style="font-size:30px;margin:20px 0 8px">Bureau du boss</h1>' +
      (refus ? '<p class="err">Ce compte n\'a pas accès au bureau.</p><button class="btn soft" type="button" data-act="logout">Se déconnecter</button>'
        : '<form data-form="login"><label class="lbl" for="em">Email</label><input class="field" id="em" name="email" type="email" autocomplete="username" required>' +
          '<label class="lbl" for="pw">Mot de passe</label><input class="field" id="pw" name="pw" type="password" autocomplete="current-password" required>' +
          '<p class="err" id="err" role="alert"></p><button class="btn" type="submit">Entrer</button></form>') + "</div>";
  }

  function commandesHTML() {
    var rows = state.commandes.map(function (c) {
      return '<div class="card"><strong>' + esc((c.membres || {}).nom) + "</strong> commande " + c.quantite + " × " + esc((c.produits || {}).nom) +
        '<div class="muted sub">' + fdate(c.cree_le) + "</div>" +
        '<div class="acts"><button class="btn small" type="button" data-act="cmd-ok" data-id="' + esc(c.id) + '">Livré</button>' +
        '<button class="btn small soft" type="button" data-act="cmd-no" data-id="' + esc(c.id) + '">Annuler</button></div></div>';
    }).join("");
    return '<h2 class="t" style="margin-top:0">Commandes à livrer</h2>' +
      '<p class="muted" style="margin-top:0">Quand tu as remis les produits, appuie sur « Livré ». Ils entrent alors dans le stock de la personne.</p>' +
      (rows || '<p class="empty">Aucune commande en attente.</p>');
  }

  function argentHTML() {
    var vers = state.versements.map(function (v) {
      return '<div class="card"><strong>' + esc((v.membres || {}).nom) + "</strong> annonce avoir versé " + F(v.montant) +
        '<div class="muted sub">' + esc(v.operateur || "") + (v.reference ? " · réf " + esc(v.reference) : "") + " · " + fdate(v.cree_le) + "</div>" +
        '<div class="acts"><button class="btn small" type="button" data-act="ver-ok" data-id="' + esc(v.id) + '">Reçu</button>' +
        '<button class="btn small soft" type="button" data-act="ver-no" data-id="' + esc(v.id) + '">Pas reçu</button></div></div>';
    }).join("");
    var rets = state.retraits.map(function (r) {
      return '<div class="card"><strong>' + esc((r.membres || {}).nom) + "</strong> demande " + F(r.montant) +
        '<div class="muted sub">' + esc(r.operateur) + " · " + esc(r.numero) + " · " + fdate(r.cree_le) + "</div>" +
        '<div class="acts"><button class="btn small" type="button" data-act="ret-ok" data-id="' + esc(r.id) + '">J\'ai payé</button>' +
        '<button class="btn small soft" type="button" data-act="ret-no" data-id="' + esc(r.id) + '">Refuser</button></div></div>';
    }).join("");
    return '<h2 class="t" style="margin-top:0">À encaisser</h2>' +
      '<p class="muted" style="margin-top:0">Argent que les vendeurs disent avoir versé. Vérifie ton Mobile Money, puis appuie sur « Reçu ».</p>' +
      (vers || '<p class="empty">Aucun versement annoncé.</p>') +
      '<h2 class="t">À payer (retraits demandés)</h2>' +
      '<p class="muted" style="margin-top:0">Envoie l\'argent par Mobile Money, puis appuie sur « J\'ai payé ».</p>' +
      (rets || '<p class="empty">Aucun retrait en attente.</p>');
  }

  function membresHTML() {
    var total = state.membres.reduce(function (s, m) { return s + Math.max(0, m.solde); }, 0);
    var rows = state.membres.map(function (m) {
      var num = intl(m.whatsapp);
      var rappel = m.du > 0 && num
        ? '<a class="btn small soft" target="_blank" rel="noopener" href="https://wa.me/' + num + "?text=" +
          encodeURIComponent("Bonjour " + m.nom + ", rappel Corbeau : tu dois verser " + F(m.du) + " ce soir. Merci !") + '">Rappeler</a>'
        : "";
      return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><strong>' + esc(m.nom) + '</strong><span class="badge ' + (m.actif ? "ok" : "no") + '">' + (m.actif ? "Actif" : "Bloqué") + "</span></div>" +
        '<div class="muted sub">' + esc(m.whatsapp || "sans numéro") + "</div>" +
        '<div class="sum"><span>À lui payer (solde)</span><strong>' + F(m.solde) + "</strong></div>" +
        '<div class="sum" style="border-top:0"><span>Doit te verser</span><strong>' + F(m.du) + "</strong></div>" +
        '<div class="sum" style="border-top:0"><span>Stock chez lui</span><strong>' + m.stock + "</strong></div>" +
        '<div class="acts"><button class="btn small" type="button" data-act="payer" data-id="' + esc(m.id) + '">Payer</button>' +
        '<button class="btn small soft" type="button" data-act="encaisser" data-id="' + esc(m.id) + '">Encaisser</button>' + rappel +
        '<button class="btn small soft" type="button" data-act="ajuster" data-id="' + esc(m.id) + '">Ajuster</button>' +
        '<button class="btn small soft" type="button" data-act="code" data-id="' + esc(m.id) + '">Nouveau code</button>' +
        '<button class="btn small soft" type="button" data-act="actif" data-id="' + esc(m.id) + '">' + (m.actif ? "Bloquer" : "Réactiver") + "</button></div></div>";
    }).join("");
    return '<h2 class="t" style="margin-top:0">Membres</h2>' +
      '<div class="due" style="margin-top:0;margin-bottom:12px"><div class="k">Paie de la semaine</div><strong>' + F(total) + ' à payer au total</strong></div>' +
      '<form class="card" data-form="membre"><strong>Nouvelle personne</strong>' +
      '<label class="lbl" for="mn">Nom</label><input class="field" id="mn" name="nom" required>' +
      '<label class="lbl" for="mw">Numéro WhatsApp</label><input class="field" id="mw" name="wa" type="tel" inputmode="tel" placeholder="ex. 0112345678">' +
      '<p class="err" id="err" role="alert"></p><button class="btn gold" type="submit">Créer et obtenir le code</button></form>' +
      (rows || '<p class="empty">Aucun membre pour le moment.</p>');
  }

  function produitsHTML() {
    var rows = state.produits.map(function (p) {
      var thumb = p.photo_url && /^https?:\/\//.test(p.photo_url)
        ? '<img src="' + esc(p.photo_url) + '" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:14px;flex-shrink:0">'
        : '<div style="width:72px;height:72px;border-radius:14px;background:#E9E5DC;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted)">SANS PHOTO</div>';
      return '<div class="card"><div style="display:flex;gap:12px;align-items:center">' + thumb +
        '<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><strong>' + esc(p.nom) + '</strong><span class="badge ' + (p.actif ? "ok" : "no") + '">' + (p.actif ? "Visible" : "Caché") + "</span></div>" +
        '<div class="muted sub">' + F(p.prix) + " · commission " + p.commission_pct + " % · gain " + F(Math.floor(p.prix * p.commission_pct / 100)) + "</div></div></div>" +
        '<div class="acts"><button class="btn small" type="button" data-act="prod-photo" data-id="' + esc(p.id) + '">' + (p.photo_url ? "Changer la photo" : "Ajouter une photo") + "</button>" +
        '<button class="btn small soft" type="button" data-act="prod-actif" data-id="' + esc(p.id) + '">' + (p.actif ? "Cacher" : "Afficher") + "</button></div></div>";
    }).join("");
    return '<h2 class="t" style="margin-top:0">Produits</h2>' +
      '<form class="card" data-form="produit"><strong>Nouveau produit</strong>' +
      '<label class="lbl" for="pn">Nom</label><input class="field" id="pn" name="nom" required>' +
      '<label class="lbl" for="pp">Prix de vente (F)</label><input class="field" id="pp" name="prix" type="number" inputmode="numeric" min="1" required>' +
      '<label class="lbl" for="pc">Commission du vendeur (%)</label><input class="field" id="pc" name="pct" type="number" inputmode="numeric" min="0" max="100" value="30" required>' +
      '<label class="lbl" for="pu">Photo du produit (facultatif)</label><input class="field" style="height:auto;padding:12px 14px" id="pu" name="photo" type="file" accept="image/*">' +
      '<label class="lbl" for="pd">Description (facultatif)</label><textarea class="field" id="pd" name="desc"></textarea>' +
      '<p class="err" id="err" role="alert"></p><button class="btn gold" type="submit">Ajouter le produit</button></form>' + rows;
  }

  var TABS = [["commandes", "Commandes", "box"], ["argent", "Argent", "wallet"], ["membres", "Membres", "user"], ["produits", "Produits", "shop"]];
  function dashHTML() {
    var body = { commandes: commandesHTML, argent: argentHTML, membres: membresHTML, produits: produitsHTML }[state.tab]();
    var cnt = { commandes: state.commandes.length, argent: state.versements.length + state.retraits.length };
    var nav = TABS.map(function (t) {
      var on = state.tab === t[0];
      return '<button class="tab' + (on ? " on" : "") + '" type="button" data-act="tab" data-tab="' + t[0] + '"' + (on ? ' aria-current="page"' : "") + ">" + svg(ICON[t[2]], 24) +
        "<span>" + t[1] + (cnt[t[0]] ? " (" + cnt[t[0]] + ")" : "") + "</span></button>";
    }).join("");
    return '<div class="wrap"><main class="pad"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong class="num" style="font-size:20px">Corbeau · Boss</strong>' +
      '<button class="linkbtn" type="button" data-act="refresh">Actualiser</button> <button class="linkbtn" type="button" data-act="logout">Déconnexion</button></div>' + body +
      '</main><nav class="tabs" aria-label="Navigation du bureau">' + nav + "</nav></div>";
  }

  function render() {
    $("#app").innerHTML = state.view === "login" ? loginHTML(false) : state.view === "refus" ? loginHTML(true) : dashHTML();
  }

  /* ---------- fenêtre ---------- */
  function openSheet(html) { var s = $("#sheet"); $(".sheet-body", s).innerHTML = html; s.hidden = false; document.body.style.overflow = "hidden"; }
  function closeSheet() { $("#sheet").hidden = true; document.body.style.overflow = ""; }
  function codeSheet(nom, wa, code) {
    var site = location.origin + "/";
    var text = "Bonjour " + nom + ", voici ton code d'accès Corbeau : " + code + "\nOuvre " + site + " et tape ce code une seule fois.";
    var num = intl(wa);
    openSheet("<h3>Code d'accès de " + esc(nom) + '</h3><p class="muted" style="margin:0">Montre-le maintenant : il ne sera plus affiché. Tu pourras en générer un nouveau.</p>' +
      '<div class="big" id="bigcode">' + esc(code) + "</div>" +
      '<button class="btn soft" type="button" data-act="copy" data-code="' + esc(code) + '">Copier le code</button><div style="height:10px"></div>' +
      '<a class="btn gold" target="_blank" rel="noopener" href="https://wa.me/' + num + "?text=" + encodeURIComponent(text) + '">' + svg(ICON.chat) + " Envoyer sur WhatsApp</a>");
  }

  /* ---------- actions ---------- */
  async function run(p, ok) {
    var r = await p;
    if (r.error) { toast(msg(r.error)); return false; }
    if (ok) toast(ok);
    await loadAll(); render();
    return true;
  }
  function find(list, id) { return list.filter(function (x) { return x.id === id; })[0]; }
  function askAmount(txt, def) {
    var v = parseInt(prompt(txt, def == null ? "" : String(def)), 10);
    return v && v !== 0 ? v : null;
  }

  /* photos : réduites sur le téléphone (1000 px max) avant l'envoi */
  function compress(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1000 / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { if (b) resolve(b); else reject(new Error("Image illisible.")); }, "image/jpeg", 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Image illisible. Choisis une photo JPG ou PNG.")); };
      img.src = url;
    });
  }
  async function uploadPhoto(file) {
    var blob = await compress(file);
    var name = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2)) + ".jpg";
    var r = await sb.storage.from("produits").upload(name, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
    if (r.error) throw r.error;
    return sb.storage.from("produits").getPublicUrl(name).data.publicUrl;
  }

  var acts = {
    tab: function (el) { state.tab = el.dataset.tab; render(); },
    "prod-photo": function (el) { state.pickFor = el.dataset.id; var p = $("#pick"); p.value = ""; p.click(); },
    close: closeSheet,
    refresh: async function () { await loadAll(); render(); toast("Mis à jour."); },
    logout: async function () { await sb.auth.signOut(); state.view = "login"; render(); },
    "cmd-ok": function (el) { if (confirm("Tu as bien remis ces produits ? Ils entrent dans le stock de la personne.")) run(sb.rpc("admin_traiter_commande", { p_id: el.dataset.id, p_livrer: true }), "Commande livrée, stock mis à jour."); },
    "cmd-no": function (el) { if (confirm("Annuler cette commande ?")) run(sb.rpc("admin_traiter_commande", { p_id: el.dataset.id, p_livrer: false }), "Commande annulée."); },
    "ver-ok": function (el) {
      var v = find(state.versements, el.dataset.id); if (!v) return;
      if (confirm("Tu as bien reçu " + F(v.montant) + " ? Le gain du vendeur sera ajouté à son solde.")) run(sb.rpc("admin_confirmer_versement", { p_id: v.id, p_ok: true }), "Versement reçu, gain ajouté.");
    },
    "ver-no": function (el) { if (confirm("Tu n'as pas reçu cet argent ?")) run(sb.rpc("admin_confirmer_versement", { p_id: el.dataset.id, p_ok: false }), "Versement refusé."); },
    "ret-ok": function (el) { if (confirm("Confirmer que tu as envoyé l'argent ? Le montant sera retiré du solde.")) run(sb.rpc("admin_traiter_retrait", { p_id: el.dataset.id, p_payer: true }), "Retrait marqué payé."); },
    "ret-no": function (el) { if (confirm("Refuser ce retrait ?")) run(sb.rpc("admin_traiter_retrait", { p_id: el.dataset.id, p_payer: false }), "Retrait refusé."); },
    payer: function (el) {
      var m = find(state.membres, el.dataset.id); if (!m) return;
      var v = askAmount("Montant que tu paies à " + m.nom + " (en F). Son solde : " + m.solde, Math.max(0, m.solde));
      if (v && v > 0) run(sb.rpc("admin_mouvement", { p_membre: m.id, p_montant: v, p_type: "paiement", p_note: "Paiement de la semaine" }), "Paiement enregistré.");
    },
    encaisser: function (el) {
      var m = find(state.membres, el.dataset.id); if (!m) return;
      if (m.du <= 0) { toast(m.nom + " n'a rien à verser."); return; }
      var v = askAmount("Montant reçu de " + m.nom + " (en F). Il doit verser : " + m.du, m.du);
      if (v && v > 0) run(sb.rpc("admin_enregistrer_versement", { p_membre: m.id, p_montant: v }), "Versement enregistré, gain ajouté.");
    },
    ajuster: function (el) {
      var m = find(state.membres, el.dataset.id); if (!m) return;
      var v = askAmount("Ajustement pour " + m.nom + " (en F). Positif pour ajouter, négatif pour retirer.");
      if (v) run(sb.rpc("admin_mouvement", { p_membre: m.id, p_montant: v, p_type: "ajustement", p_note: "Ajustement du boss" }), "Solde ajusté.");
    },
    code: async function (el) {
      var m = find(state.membres, el.dataset.id); if (!m) return;
      if (!confirm("Créer un nouveau code pour " + m.nom + " ? L'ancien code ne marchera plus.")) return;
      var r = await sb.rpc("admin_regenerer_code", { p_membre: m.id });
      if (r.error) { toast(msg(r.error)); return; }
      codeSheet(m.nom, m.whatsapp, r.data);
    },
    actif: function (el) {
      var m = find(state.membres, el.dataset.id); if (!m) return;
      run(sb.rpc("admin_activer_membre", { p_membre: m.id, p_actif: !m.actif }), m.actif ? "Membre bloqué." : "Membre réactivé.");
    },
    "prod-actif": function (el) {
      var p = find(state.produits, el.dataset.id); if (!p) return;
      run(sb.from("produits").update({ actif: !p.actif }).eq("id", p.id), p.actif ? "Produit caché." : "Produit affiché.");
    },
    copy: async function (el) {
      try { await navigator.clipboard.writeText(el.dataset.code); toast("Code copié."); } catch (e) { toast("Copie impossible, recopie à la main."); }
    }
  };

  var forms = {
    login: async function (f) {
      busy(f, true); setErr("");
      var r = await sb.auth.signInWithPassword({ email: f.elements.email.value.trim(), password: f.elements.pw.value });
      if (r.error) { setErr("Email ou mot de passe incorrect."); busy(f, false); return; }
      await start();
    },
    membre: async function (f) {
      busy(f, true); setErr("");
      var nom = f.elements.nom.value.trim(), wa = f.elements.wa.value.trim();
      var r = await sb.rpc("admin_creer_membre", { p_nom: nom, p_whatsapp: wa });
      if (r.error) { setErr(msg(r.error)); busy(f, false); return; }
      await loadAll(); render(); codeSheet(nom, wa, r.data);
    },
    produit: async function (f) {
      busy(f, true); setErr("");
      try {
        var file = f.elements.photo.files[0], desc = f.elements.desc.value.trim();
        var photo = file ? await uploadPhoto(file) : null;
        var r = await sb.from("produits").insert({
          nom: f.elements.nom.value.trim(), prix: parseInt(f.elements.prix.value, 10), commission_pct: parseInt(f.elements.pct.value, 10),
          photo_url: photo, description: desc || null
        });
        if (r.error) throw r.error;
      } catch (e) { setErr(msg(e)); busy(f, false); return; }
      toast("Produit ajouté."); await loadAll(); render();
    }
  };

  document.addEventListener("click", function (e) {
    if (e.target.id === "sheet") { closeSheet(); return; }
    var el = e.target.closest("[data-act]");
    if (el && acts[el.dataset.act]) acts[el.dataset.act](el);
  });
  document.addEventListener("change", async function (e) {
    if (e.target.id !== "pick" || !e.target.files[0] || !state.pickFor) return;
    var id = state.pickFor; state.pickFor = null;
    toast("Envoi de la photo…");
    try {
      var url = await uploadPhoto(e.target.files[0]);
      await run(sb.from("produits").update({ photo_url: url }).eq("id", id), "Photo mise à jour.");
    } catch (err) { toast(msg(err)); }
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (forms[f.dataset.form]) forms[f.dataset.form](f);
  });

  async function start() {
    var r = await sb.rpc("is_admin");
    if (r.error || r.data !== true) { state.view = "refus"; render(); return; }
    await loadAll();
    state.view = "dash";
    render();
  }

  (async function init() {
    var s = await sb.auth.getSession();
    if (s.data && s.data.session) await start(); else render();
  })();
})();
</script>
</body>
</html>
