<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOSS OS V4</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-black text-white min-h-screen p-4"><div class="max-w-2xl mx-auto">
<h1 class="text-2xl font-black">🦅 BOSS OS V4</h1><p class="text-xs text-zinc-500 mb-4" id="count">Chargement...</p>
<div class="flex gap-2 mb-4"><button onclick="load()" class="bg-white text-black px-4 py-2 rounded-full text-xs font-bold">Refresh</button><button onclick="show('attente')" class="bg-zinc-800 px-3 py-2 rounded-full text-xs">⏳ En attente</button><button onclick="show('tous')" class="bg-zinc-800 px-3 py-2 rounded-full text-xs">👥 Tous</button></div>
<div id="list" class="space-y-3"></div>
</div>
<script>
const supa=supabase.createClient("https://nmkpanyeswafuchmvclj.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ta3Bhbnllc3dhZnVjaG12Y2xqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTcxNTIsImV4cCI6MjEwNTkzMzE1Mn0.fleM-nhlLGteYjbdmWIlkzsgQS-zs3cf38-hTVBiKm8");
let all=[];
async function load(){document.getElementById('list').innerHTML="Chargement..."; const {data,error}=await supa.from('corbeau_users').select('*').order('created_at',{ascending:false}).limit(50); if(error){document.getElementById('list').innerHTML=error.message; return;} all=data; document.getElementById('count').innerText=`Total: ${data.length} vendeurs`; render(all.filter(u=>u.statut_verif==='en_attente'));}
function render(data){document.getElementById('list').innerHTML=data.length?data.map(u=>`<div class="bg-zinc-900 p-4 rounded-2xl"><div class="flex justify-between"><div><p class="font-bold">${u.prenom} ${u.nom} - ${u.code_vendeur}</p><p class="text-xs text-zinc-500">${u.whatsapp} - ${u.classe} - ${u.statut_verif}</p><p class="text-xs text-zinc-600">${new Date(u.created_at).toLocaleString()}</p></div><div class="flex gap-2"><button onclick="verif('${u.code_vendeur}')" class="bg-green-600 px-3 py-1.5 rounded-full text-xs font-bold">Valider</button><button onclick="refus('${u.code_vendeur}')" class="bg-red-600 px-3 py-1.5 rounded-full text-xs">Refuser</button></div></div>${u.photo_cni?`<div class="flex gap-2 mt-3"><img src="${u.photo_cni}" class="w-1/2 rounded-xl"><img src="${u.photo_visage}" class="w-1/2 rounded-xl"></div>`:''}</div>`).join(''):`<p class='text-center text-zinc-600 py-10'>Aucun en attente</p>`;}
function show(f){if(f==='attente')render(all.filter(u=>u.statut_verif==='en_attente')); else render(all);}
async function verif(code){await supa.from('corbeau_users').update({statut_verif:'verifie'}).eq('code_vendeur',code); alert(code+" validé!"); load();}
async function refus(code){await supa.from('corbeau_users').update({statut_verif:'refuse'}).eq('code_vendeur',code); alert(code+" refusé"); load();}
load();
</script></body></html>
