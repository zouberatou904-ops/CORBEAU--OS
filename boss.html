<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOSS V8 ULTIME</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-black text-white p-3"><div class="max-w-xl mx-auto">
<h1 class="text-2xl font-black">🦅 BOSS V8 ULTIME</h1><p id="stats" class="text-xs text-zinc-500 mb-3">Chargement...</p>

<div class="flex gap-1 overflow-x-auto pb-2 mb-3 text-[11px] scrollbar-none">
<button onclick="switchTab('verif')" id="tabVerif" class="tab bg-white text-black px-3 py-2 rounded-full font-bold">⏳ Vérif</button>
<button onclick="switchTab('produits')" id="tabProduits" class="tab bg-zinc-800 px-3 py-2 rounded-full">🛒 Produits</button>
<button onclick="switchTab('versements')" id="tabVersements" class="tab bg-zinc-800 px-3 py-2 rounded-full">💰 Argent</button>
<button onclick="switchTab('commandes')" id="tabCommandes" class="tab bg-zinc-800 px-3 py-2 rounded-full">📦 Commandes</button>
<button onclick="switchTab('all')" id="tabAll" class="tab bg-zinc-800 px-3 py-2 rounded-full">👥 Tous</button>
</div>

<button onclick="loadAll()" class="bg-zinc-900 w-full py-2 rounded-xl text-xs mb-3">🔄 Actualiser</button>

<!-- VERIF -->
<div id="listVerif" class="tabContent space-y-3"></div>

<!-- PRODUITS - NOUVEAU BOSS PEUT AJOUTER -->
<div id="listProduits" class="tabContent hidden space-y-3">
<div class="bg-zinc-900 p-4 rounded-2xl">
<p class="font-bold text-sm mb-3">➕ Ajouter un produit (fini Supabase!)</p>
<input id="pNom" placeholder="Nom du produit ex: PowerBank" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 mb-2 text-sm">
<input id="pPrix" type="number" placeholder="Prix ex: 12000" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 mb-2 text-sm">
<input id="pStock" type="number" placeholder="Stock ex: 50" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 mb-3 text-sm">
<button onclick="addProduit()" class="w-full bg-white text-black font-black py-2.5 rounded-xl text-sm">Ajouter produit 🚀</button>
</div>
<div id="listProduitsItems" class="space-y-2"></div>
</div>

<div id="listVersements" class="tabContent hidden space-y-2"></div>
<div id="listCommandes" class="tabContent hidden space-y-2"></div>
<div id="listAll" class="tabContent hidden space-y-2"></div>
</div>

<script>
const supa=supabase.createClient("https://nmkpanyeswafuchmvclj.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ta3Bhbnllc3dhZnVjaG12Y2xqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTcxNTIsImV4cCI6MjEwNTkzMzE1Mn0.fleM-nhlLGteYjbdmWIlkzsgQS-zs3cf38-hTVBiKm8");
let users=[];
function switchTab(t){document.querySelectorAll('.tabContent').forEach(e=>e.classList.add('hidden')); document.getElementById('list'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden'); document.querySelectorAll('.tab').forEach(e=>e.className='tab bg-zinc-800 px-3 py-2 rounded-full'); document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).className='tab bg-white text-black px-3 py-2 rounded-full font-bold'; if(t==='produits') loadProduits(); if(t==='versements') loadVersements(); if(t==='commandes') loadCommandes(); if(t==='all') renderAll();}

async function loadAll(){
 document.getElementById('stats').innerText="Chargement...";
 const {data:u,error}=await supa.from('corbeau_users').select('*').order('created_at',{ascending:false}).limit(100);
 if(error){document.getElementById('stats').innerText="❌ "+error.message; return;}
 users=u||[];
 const enAtt=users.filter(x=>x.statut_verif==='en_attente').length;
 document.getElementById('stats').innerText=`${users.length} vendeurs | ${enAtt} en attente | Sabirou = verifie ✅`;
 renderVerif();
}

function renderVerif(){
 const d=users.filter(x=>x.statut_verif==='en_attente');
 document.getElementById('listVerif').innerHTML=d.length?d.map(u=>`
 <div class="bg-zinc-900 p-4 rounded-2xl">
  <div class="flex justify-between"><div>
   <p class="font-bold">${u.prenom} ${u.nom||''} - ${u.code_vendeur}</p>
   <p class="text-xs text-zinc-500">${u.whatsapp} | ${u.classe||''}</p>
  </div>
  <div class="flex flex-col gap-1">
   <button onclick="verif('${u.code_vendeur}')" class="bg-green-600 px-3 py-1.5 rounded-full text-xs font-bold">✅ Valider</button>
   <button onclick="refus('${u.code_vendeur}')" class="bg-red-600 px-3 py-1.5 rounded-full text-xs">❌ Refuser</button>
  </div></div>
  ${u.photo_cni?`<div class="flex gap-2 mt-3"><a href="${u.photo_cni}" target="_blank" class="w-1/2"><img src="${u.photo_cni}" class="rounded-xl w-full"></a><a href="${u.photo_visage}" target="_blank" class="w-1/2"><img src="${u.photo_visage}" class="rounded-xl w-full"></a></div>`:''}
 </div>`).join(''):`<p class='text-center text-zinc-600 py-10'>✅ Aucun en attente! Tout est vérifié!<br><br><b class="text-white">Sabirou CRB4073 est déjà vérifié!</b><br>Va sur Boutique pour voir les produits</p>`;
}

function renderAll(){
 document.getElementById('listAll').innerHTML=users.map(u=>`<div class="bg-zinc-900 p-3 rounded-2xl flex justify-between"><div><p class="font-bold text-sm">${u.code_vendeur} - ${u.prenom} ${u.nom||''}</p><p class="text-xs text-zinc-500">${u.statut_verif} - ${u.solde||0}F - ${u.whatsapp}</p></div><span class="text-xs ${u.statut_verif==='verifie'?'text-green-400':'text-yellow-400'}">${u.statut_verif}</span></div>`).join('');
}

async function loadProduits(){
 const {data}=await supa.from('corbeau_products').select('*').order('created_at',{ascending:false});
 document.getElementById('listProduitsItems').innerHTML=(data||[]).map(p=>`<div class="bg-zinc-900 p-3 rounded-2xl flex justify-between"><div><p class="font-bold text-sm">${p.nom}</p><p class="text-xs text-zinc-500">${p.prix}F - Stock ${p.stock}</p></div><button onclick="deleteProduit('${p.id}')" class="bg-red-900/50 px-3 py-1 rounded-full text-xs">🗑️</button></div>`).join('')||"<p class='text-zinc-600 text-center text-xs py-6'>Pas encore de produits, ajoute en haut!</p>";
}
async function addProduit(){
 const nom=document.getElementById('pNom').value, prix=parseInt(document.getElementById('pPrix').value), stock=parseInt(document.getElementById('pStock').value)||0;
 if(!nom||!prix) return alert("Nom + Prix obligatoires");
 await supa.from('corbeau_products').insert({nom,prix,stock});
 alert("✅ Produit ajouté!");
 document.getElementById('pNom').value=""; document.getElementById('pPrix').value=""; document.getElementById('pStock').value="";
 loadProduits();
}
async function deleteProduit(id){ if(!confirm("Supprimer?")) return; await supa.from('corbeau_products').delete().eq('id',id); loadProduits();}

async function loadVersements(){const {data}=await supa.from('corbeau_rapports').select('*').order('created_at',{ascending:false}).limit(50); document.getElementById('listVersements').innerHTML=(data||[]).map(r=>`<div class="bg-zinc-900 p-3 rounded-2xl"><p class="font-bold text-sm">${r.vendeur_code} - ${r.vendeur_nom}</p><p class="text-xs">${r.ventes_jour} ventes | ${r.total_encaisse}F | À verser ${r.a_verser_plateforme}F</p><p class="text-[10px] text-zinc-500">${r.statut}</p>${r.statut==='en_attente'?`<button onclick="confirmVersement('${r.id}')" class="bg-green-600 px-3 py-1 rounded-full text-xs mt-2">Confirmer reçu</button>`:''}</div>`).join('')||"Pas de versements";}
async function loadCommandes(){const {data}=await supa.from('corbeau_commandes').select('*').order('created_at',{ascending:false}).limit(50); document.getElementById('listCommandes').innerHTML=(data||[]).map(c=>`<div class="bg-zinc-900 p-3 rounded-2xl"><p class="text-sm">${c.vendeur_code} - ${c.produit_nom}</p><p class="text-xs text-zinc-500">${c.statut}</p></div>`).join('')||"Pas de commandes";}

async function verif(code){await supa.from('corbeau_users').update({statut_verif:'verifie'}).eq('code_vendeur',code); alert(code+" ✅ Validé!"); loadAll();}
async function refus(code){await supa.from('corbeau_users').update({statut_verif:'refuse'}).eq('code_vendeur',code); alert(code+" ❌ Refusé"); loadAll();}
async function confirmVersement(id){await supa.from('corbeau_rapports').update({statut:'confirme'}).eq('id',id); alert("Confirmé!"); loadVersements();}

loadAll();
</script></body></html>
