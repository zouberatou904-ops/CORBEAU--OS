<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORBEAU BOSS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white min-h-screen p-4">
<h1 class="text-3xl font-black">🦅 CORBEAU BOSS</h1>
<p class="opacity-50 text-xs">nmkpanyeswafuchmvclj.supabase.co</p>
<div class="grid grid-cols-2 gap-3 mt-6">
<div class="bg-zinc-900 rounded-2xl p-4"><p class="text-xs opacity-50">Vendeurs</p><p id="k1" class="text-2xl font-black">-</p></div>
<div class="bg-zinc-900 rounded-2xl p-4"><p class="text-xs opacity-50">Commandes</p><p id="k2" class="text-2xl font-black">-</p></div>
<div class="bg-zinc-900 rounded-2xl p-4"><p class="text-xs opacity-50">Ventes</p><p id="k3" class="text-2xl font-black">-</p></div>
<div class="bg-zinc-900 rounded-2xl p-4"><p class="text-xs opacity-50">En attente</p><p id="k4" class="text-2xl font-black">-</p></div>
</div>
<button onclick="loadAll()" class="bg-white text-black px-4 py-2 rounded-full font-bold mt-4">Refresh</button>
<div id="list" class="mt-6 space-y-3"></div>
<script>
const SUPA_URL="https://nmkpanyeswafuchmvclj.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ta3Bhbnllc3dhZnVjaG12Y2xqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTcxNTIsImV4cCI6MjEwNTkzMzE1Mn0.fleM-nhlLGteYjbdmWIlkzsgQS-zs3cf38-hTVBiKm8";
const supabase=window.supabase.createClient(SUPA_URL,SUPA_KEY);
async function loadAll(){
 let p=await supabase.from('corbeau_pending').select('*');
 let u=await supabase.from('corbeau_users').select('*');
 let o=await supabase.from('corbeau_orders').select('*');
 let v=await supabase.from('corbeau_ventes').select('*');
 document.getElementById('k1').innerText=u.data?.length||0;
 document.getElementById('k2').innerText=o.data?.length||0;
 document.getElementById('k3').innerText=v.data?.length||0;
 document.getElementById('k4').innerText=p.data?.length||0;
 document.getElementById('list').innerHTML='<h2 class="font-black">Commandes</h2>'+(o.data||[]).map(x=>`<div class="bg-zinc-900 p-3 rounded-xl mt-2"><b>${x.produit_nom} - ${x.prix}F</b><br><span class="text-xs">Client: ${x.client_nom} (${x.client_whatsapp})</span><br><span class="text-xs opacity-50">Vendeur: ${x.vendeur_nom} ${x.vendeur_code}</span><br><button onclick="valider('${x.id}','${x.vendeur_code}','${x.vendeur_nom}','${x.produit_nom}',${x.prix},${x.commission})" class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold mt-2">Valider + Payer ${x.commission}F</button></div>`).join('');
}
async function valider(id,code,nom,prod,prix,comm){
 await supabase.from('corbeau_ventes').insert({order_id:id,vendeur_code:code,vendeur_nom:nom,produit_nom:prod,prix,commission:comm,statut:'valide'});
 let us=await supabase.from('corbeau_users').select('*').eq('code_vendeur',code).single();
 if(us.data) await supabase.from('corbeau_users').update({solde:(us.data.solde||0)+comm}).eq('id',us.data.id);
 await supabase.from('corbeau_orders').update({statut:'valide'}).eq('id',id);
 loadAll();
}
loadAll();
</script>
</body></html>
