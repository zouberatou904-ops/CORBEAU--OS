<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOSS OS V5 COMPLET</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-black text-white min-h-screen p-3"><div class="max-w-2xl mx-auto">
<h1 class="text-2xl font-black">🦅 BOSS OS V5</h1><p class="text-xs text-zinc-500 mb-3" id="stats">Chargement...</p>
<div class="flex gap-1 overflow-x-auto pb-2 mb-3 text-[11px]"><button onclick="switchTab('verif')" id="tabVerif" class="tab bg-white text-black px-3 py-2 rounded-full font-bold">⏳ Vérif</button><button onclick="switchTab('versements')" id="tabVersements" class="tab bg-zinc-800 px-3 py-2 rounded-full">💰 Versements</button><button onclick="switchTab('commandes')" id="tabCommandes" class="tab bg-zinc-800 px-3 py-2 rounded-full">📦 Commandes</button><button onclick="switchTab('support')" id="tabSupport" class="tab bg-zinc-800 px-3 py-2 rounded-full">🆘 Support</button><button onclick="switchTab('all')" id="tabAll" class="tab bg-zinc-800 px-3 py-2 rounded-full">👥 Tous</button></div>
<button onclick="loadAll()" class="bg-zinc-900 w-full py-2 rounded-xl text-xs mb-3">🔄 Refresh tout</button>
<div id="listVerif" class="tabContent space-y-3"></div>
<div id="listVersements" class="tabContent hidden space-y-2"></div>
<div id="listCommandes" class="tabContent hidden space-y-2"></div>
<div id="listSupport" class="tabContent hidden space-y-2"></div>
<div id="listAll" class="tabContent hidden space-y-2"></div>
</div>
<script>
const supa=supabase.createClient("https://nmkpanyeswafuchmvclj.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ta3Bhbnllc3dhZnVjaG12Y2xqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTcxNTIsImV4cCI6MjEwNTkzMzE1Mn0.fleM-nhlLGteYjbdmWIlkzsgQS-zs3cf38-hTVBiKm8");
let users=[];
function switchTab(t){document.querySelectorAll('.tabContent').forEach(e=>e.classList.add('hidden')); document.getElementById('list'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden'); document.querySelectorAll('.tab').forEach(e=>e.className='tab bg-zinc-800 px-3 py-2 rounded-full'); document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).className='tab bg-white text-black px-3 py-2 rounded-full font-bold'; if(t==='versements') loadVersements(); if(t==='commandes') loadCommandes(); if(t==='support') loadSupport(); if(t==='all') renderAll();}
async function loadAll(){document.getElementById('stats').innerText="Chargement..."; const {data:u}=await supa.from('corbeau_users').select('*').order('created_at',{ascending:false}).limit(100); users=u||[]; const {data:rap}=await supa.from('corbeau_rapports').select('*').eq('statut','en_attente'); const {data:com}=await supa.from('corbeau_commandes').select('*').eq('statut','en_attente'); document.getElementById('stats').innerText=`${users.length} vendeurs | ${users.filter(x=>x.statut_verif==='en_attente').length} en attente | ${rap?.length||0} versements | ${com?.length||0} commandes`; renderVerif(); loadVersements(); loadCommandes(); loadSupport();}
function renderVerif(){const d=users.filter(x=>x.statut_verif==='en_attente'); document.getElementById('listVerif').innerHTML=d.length?d.map(u=>`<div class="bg-zinc-900 p-4 rounded-2xl"><div class="flex justify-between"><div><p class="font-bold">${u.prenom} ${u.nom} - ${u.code_vendeur}</p><p class="text-xs text-zinc-500">${u.whatsapp} | ${u.classe} | ${u.age} ans</p><p class="text-[10px] text-zinc-600">${new Date(u.created_at).toLocaleString()}</p></div><div class="flex flex-col gap-1"><button onclick="verif('${u.code_vendeur}')" class="bg-green-600 px-3 py-1.5 rounded-full text-xs font-bold">✅ Valider</button><button onclick="refus('${u.code_vendeur}')" class="bg-red-600 px-3 py-1.5 rounded-full text-xs">❌ Refuser</button></div></div>${u.photo_cni?`<div class="flex gap-2 mt-3"><a href="${u.photo_cni}" target="_blank" class="w-1/2"><img src="${u.photo_cni}" class="rounded-xl w-full"></a><a href="${u.photo_visage}" target="_blank" class="w-1/2"><img src="${u.photo_visage}" class="rounded-xl w-full"></a></div>`:''}</div>`).join(''):`<p class='text-center text-zinc-600 py-10'>✅ Aucun en attente - Tout est vérifié!</p>`;}
function renderAll(){document.getElementById('listAll').innerHTML=users.map(u=>`<div class="bg-zinc-900 p-3 rounded-2xl flex justify-between"><div><p class="font-bold text-sm">${u.code_vendeur} - ${u.prenom}</p><p class="text-xs text-zinc-500">${u.statut_verif} - ${u.solde||0}F</p></div><span class="text-xs ${u.statut_verif==='verifie'?'text-green-400':'text-yellow-400'}">${u.statut_verif}</span></div>`).join('');}
async function loadVersements(){const {data}=await supa.from('corbeau_rapports').select('*').order('created_at',{ascending:false}).limit(50); document.getElementById('listVersements').innerHTML=(data||[]).map(r=>`<div class="bg-zinc-900 p-3 rounded-2xl"><p class="font-bold text-sm">${r.vendeur_code} - ${r.vendeur_nom}</p><p class="text-xs">${r.ventes_jour} ventes | Total ${r.total_encaisse}F | À verser ${r.a_verser_plateforme}F | Com ${r.ma_commission}F</p><p class="text-[10px] text-zinc-500">${r.methode} - ${r.transaction_id||''} - ${r.statut}</p>${r.statut==='en_attente'?`<div class="flex gap-2 mt-2"><button onclick="confirmVersement('${r.id}')" class="bg-green-600 px-3 py-1 rounded-full text-xs">Confirmer reçu</button><button onclick="refusVersement('${r.id}')" class="bg-red-600 px-3 py-1 rounded-full text-xs">Refuser</button></div>`:''}</div>`).join('')||"Pas de versements";}
async function loadCommandes(){const {data}=await supa.from('corbeau_commandes').select('*').order('created_at',{ascending:false}).limit(50); document.getElementById('listCommandes').innerHTML=(data||[]).map(c=>`<div class="bg-zinc-900 p-3 rounded-2xl"><p class="text-sm">${c.vendeur_code} - ${c.produit_nom}</p><p class="text-xs text-zinc-500">${c.statut} - ${new Date(c.created_at).toLocaleDateString()}</p></div>`).join('')||"Pas de commandes";}
async function loadSupport(){const {data}=await supa.from('corbeau_support').select('*').order('created_at',{ascending:false}).limit(50); document.getElementById('listSupport').innerHTML=(data||[]).map(s=>`<div class="bg-zinc-900 p-3 rounded-2xl"><p class="font-bold text-sm">${s.vendeur_code} - ${s.sujet}</p><p class="text-xs">${s.message}</p><p class="text-[10px] text-zinc-500">${s.statut}</p></div>`).join('')||"Pas de support";}
async function verif(code){await supa.from('corbeau_users').update({statut_verif:'verifie'}).eq('code_vendeur',code); alert(code+" ✅ Validé!"); loadAll();}
async function refus(code){await supa.from('corbeau_users').update({statut_verif:'refuse'}).eq('code_vendeur',code); alert(code+" ❌ Refusé"); loadAll();}
async function confirmVersement(id){await supa.from('corbeau_rapports').update({statut:'confirme'}).eq('id',id); alert("Versement confirmé!"); loadVersements();}
async function refusVersement(id){await supa.from('corbeau_rapports').update({statut:'refuse'}).eq('id',id); alert("Refusé"); loadVersements();}
loadAll();
</script></body></html>
