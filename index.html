<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORBEAU OS V6</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-[#0a0a0a] text-white min-h-screen"><div class="max-w-md mx-auto p-4">
<h1 class="text-2xl font-black mt-2">🦅 CORBEAU V6</h1><p class="text-zinc-500 text-xs mb-4">Inscription ultra rapide</p>
<div id="loginBox" class="bg-zinc-900 rounded-[24px] p-5">
<input id="codeInput" placeholder="TON CODE CRBXXXX" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-3 text-sm uppercase font-bold">
<button onclick="login()" class="w-full bg-white text-black font-black py-3 rounded-xl">Entrer 🚀</button>
<div class="mt-4 pt-4 border-t border-zinc-800">
<p class="text-xs font-bold mb-2">Inscription</p>
<input id="prenom" placeholder="Prénom" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-sm"><input id="nom" placeholder="Nom" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-sm"><input id="age" type="number" placeholder="Âge" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-sm"><input id="classe" placeholder="Classe" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-sm"><input id="whatsapp" placeholder="WhatsApp" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-3 text-sm">
<div class="border border-dashed border-zinc-700 rounded-xl p-3 mb-2"><p class="text-xs mb-2">📸 Photo CNI</p><input type="file" id="fileCNI" accept="image/*" class="text-xs w-full"></div>
<div class="border border-dashed border-zinc-700 rounded-xl p-3 mb-3"><p class="text-xs mb-2">🤳 Photo visage</p><input type="file" id="fileVisage" accept="image/*" class="text-xs w-full"></div>
<button onclick="register()" id="btnRegister" class="w-full bg-white text-black font-bold py-3 rounded-xl text-sm">S'inscrire</button>
<p id="registerMsg" class="text-xs mt-3 text-center break-all"></p>
</div></div>
<div id="dash" class="hidden"><div class="bg-zinc-900 rounded-2xl p-4"><p class="font-bold" id="userName"></p><p class="text-xs" id="userCode"></p><button onclick="location.reload()" class="text-xs underline mt-2">Déconnexion</button></div><div class="bg-green-500/20 text-green-400 p-3 rounded-xl mt-3 text-center text-sm">✅ Compte vérifié! Tu peux vendre!</div></div>
</div>
<script>
const SUPA_URL="https://nmkpanyeswafuchmvclj.supabase.co"; const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ta3Bhbnllc3dhZnVjaG12Y2xqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTcxNTIsImV4cCI6MjEwNTkzMzE1Mn0.fleM-nhlLGteYjbdmWIlkzsgQS-zs3cf38-hTVBiKm8"; const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
async function compressToBlob(file){return new Promise(res=>{const r=new FileReader(); r.onload=e=>{const img=new Image(); img.onload=()=>{const c=document.createElement('canvas'); let w=img.width,h=img.height; const max=600; if(w>h){if(w>max){h*=max/w; w=max;}} else {if(h>max){w*=max/h; h=max;}} c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>res(b),'image/jpeg',0.5);}; img.src=e.target.result;}; r.readAsDataURL(file);});}
async function login(){const code=document.getElementById('codeInput').value.trim().toUpperCase(); if(!code) return alert("Code?"); const {data}=await supa.from('corbeau_users').select('*').eq('code_vendeur',code).maybeSingle(); if(!data) return alert("Introuvable"); document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); document.getElementById('userName').innerText=data.prenom+" "+data.nom; document.getElementById('userCode').innerText=data.code_vendeur;}
async function register(){const prenom=document.getElementById('prenom').value.trim(), nom=document.getElementById('nom').value.trim(), age=document.getElementById('age').value, classe=document.getElementById('classe').value.trim(), whatsapp=document.getElementById('whatsapp').value.trim(), f1=document.getElementById('fileCNI').files[0], f2=document.getElementById('fileVisage').files[0], btn=document.getElementById('btnRegister'), msg=document.getElementById('registerMsg'); if(!prenom||!nom||!whatsapp||!f1||!f2){msg.innerText="❌ Remplis tout"; return;} btn.innerText="Upload 1/2..."; btn.disabled=true; try{const code="CRB"+Math.floor(1000+Math.random()*9000); const b1=await compressToBlob(f1); const b2=await compressToBlob(f2); const path1=`${code}_cni.jpg`; const path2=`${code}_visage.jpg`; let {error:e1}=await supa.storage.from('corbeau-photos').upload(path1,b1,{upsert:true}); if(e1) throw e1; btn.innerText="Upload 2/2..."; let {error:e2}=await supa.storage.from('corbeau-photos').upload(path2,b2,{upsert:true}); if(e2) throw e2; const url1=supa.storage.from('corbeau-photos').getPublicUrl(path1).data.publicUrl; const url2=supa.storage.from('corbeau-photos').getPublicUrl(path2).data.publicUrl; btn.innerText="Enregistrement..."; const {error}=await supa.from('corbeau_users').insert({code_vendeur:code,prenom,nom,age:parseInt(age)||18,classe,whatsapp,photo_cni:url1,photo_visage:url2,statut_verif:'en_attente',solde:0}); if(error) throw error; msg.innerHTML=`✅ INSCRIT! Code: <b>${code}</b><br>Attente Boss`; document.getElementById('codeInput').value=code; btn.innerText="S'inscrire"; btn.disabled=false; alert("Inscrit! Code: "+code);} catch(err){msg.innerText="❌ "+err.message; btn.innerText="S'inscrire"; btn.disabled=false; console.error(err);}}
</script></body></html>
