<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORBEAU OS V7</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-[#0a0a0a] text-white min-h-screen"><div class="max-w-md mx-auto p-4">
<h1 class="text-2xl font-black mt-2">🦅 CORBEAU V7</h1><p class="text-zinc-500 text-xs mb-4">Vends • Encaisse • Verse • Gagne</p>
<div id="loginBox" class="bg-zinc-900 rounded-[24px] p-5">
<input id="codeInput" placeholder="TON CODE CRBXXXX" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-3 text-sm uppercase font-bold">
<button onclick="login()" class="w-full bg-white text-black font-black py-3 rounded-xl">Entrer 🚀</button>
<div class="mt-4 pt-4 border-t border-zinc-800">
<p class="text-xs font-bold mb-2">Nouveau vendeur? Inscris-toi</p>
<input id="prenom" placeholder="Prénom" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-sm"><input id="nom" placeholder="Nom" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-sm"><input id="age" type="number" placeholder="Âge" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-sm"><input id="classe" placeholder="Classe" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-sm"><input id="whatsapp" placeholder="WhatsApp 229..." class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-3 text-sm">
<div class="border border-dashed border-zinc-700 rounded-xl p-3 mb-2"><p class="text-xs mb-2">📸 Photo CNI</p><input type="file" id="fileCNI" accept="image/*" class="text-xs w-full"></div>
<div class="border border-dashed border-zinc-700 rounded-xl p-3 mb-3"><p class="text-xs mb-2">🤳 Photo visage</p><input type="file" id="fileVisage" accept="image/*" class="text-xs w-full"></div>
<button onclick="register()" id="btnRegister" class="w-full bg-white text-black font-bold py-3 rounded-xl text-sm">S'inscrire</button>
<p id="registerMsg" class="text-xs mt-3 text-center break-all"></p>
</div></div>
<div id="dash" class="hidden">
<div class="bg-zinc-900 rounded-[20px] p-4 flex justify-between items-center mb-3"><div><p class="font-bold" id="userName"></p><p class="text-xs text-zinc-500" id="userCode"></p></div><div class="text-right"><p class="text-xs text-zinc-500">Solde</p><p class="font-black text-lg" id="userSolde">0F</p><button onclick="location.reload()" class="text-[10px] text-zinc-600 underline">Déconnexion</button></div></div>
<div id="statusBox" class="rounded-2xl p-3 mb-3 text-sm text-center"></div>
<div class="flex gap-1.5 overflow-x-auto pb-2 mb-3 text-[11px]"><button onclick="showV('boutique')" id="vbBoutique" class="vtab bg-white text-black px-3 py-2 rounded-full font-bold">🛒 Boutique</button><button onclick="showV('annonces')" id="vbAnnonces" class="vtab bg-zinc-900 px-3 py-2 rounded-full">📢 Annonces</button><button onclick="showV('projets')" id="vbProjets" class="vtab bg-zinc-900 px-3 py-2 rounded-full">🚀 Projets</button><button onclick="showV('messages')" id="vbMessages" class="vtab bg-zinc-900 px-3 py-2 rounded-full">💬 Boss</button><button onclick="showV('rapport')" id="vbRapport" class="vtab bg-zinc-900 px-3 py-2 rounded-full">💰 Verser</button><button onclick="showV('support')" id="vbSupport" class="vtab bg-zinc-900 px-3 py-2 rounded-full">🆘 Support</button></div>
<div id="v-boutique"><div id="products" class="grid grid-cols-2 gap-3"></div><div id="myOrders" class="mt-4 space-y-2"></div></div>
<div id="v-annonces" class="hidden"><div id="listAnnoncesV" class="space-y-2"></div></div>
<div id="v-projets" class="hidden"><div id="listProjetsV" class="space-y-2"></div></div>
<div id="v-messages" class="hidden"><div id="listMessagesV" class="space-y-2"></div></div>
<div id="v-rapport" class="hidden"><div class="bg-zinc-900 rounded-2xl p-4"><h3 class="font-bold text-sm mb-3">💰 Verser revenu</h3><input id="rVentes" type="number" placeholder="Nb ventes" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 mb-2 text-sm"><input id="rTotal" type="number" placeholder="Total encaissé" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 mb-2 text-sm"><input id="rAverser" type="number" placeholder="À verser Boss" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 mb-2 text-sm"><input id="rMaCom" type="number" placeholder="Ma commission" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 mb-3 text-sm"><div class="grid grid-cols-2 gap-2 mb-3"><button onclick="setMethode('confirmation_directe')" id="btnConf" class="bg-zinc-800 p-3 rounded-xl text-xs font-bold">✅ Direct</button><button onclick="setMethode('depot_momo')" id="btnDepot" class="bg-zinc-800 p-3 rounded-xl text-xs font-bold">📱 MoMo</button></div><div id="depotBox" class="hidden mb-3"><input id="rTransac" placeholder="Numéro transaction" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-sm"></div><button onclick="envoyerRapport()" class="w-full bg-white text-black font-black py-3 rounded-xl text-sm">Verser</button></div><div id="listRapportsV" class="mt-4 space-y-2"></div></div>
<div id="v-support" class="hidden"><div class="bg-zinc-900 rounded-2xl p-4 mb-3"><input id="supportSujet" placeholder="Sujet" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 mb-2 text-sm"><textarea id="supportMessage" placeholder="Ton problème..." class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 h-20 mb-2 text-sm"></textarea><button onclick="envoyerSupport()" class="w-full bg-white text-black font-black py-2.5 rounded-xl text-sm">Envoyer</button></div><div id="listSupportV" class="space-y-2"></div></div>
</div></div>
<script>
const SUPA_URL="https://nmkpanyeswafuchmvclj.supabase.co"; const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ta3Bhbnllc3dhZnVjaG12Y2xqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTcxNTIsImV4cCI6MjEwNTkzMzE1Mn0.fleM-nhlLGteYjbdmWIlkzsgQS-zs3cf38-hTVBiKm8"; const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let currentUser=null, methodeChoisi='';
function compressToBlob(file){return new Promise(res=>{const r=new FileReader(); r.onload=e=>{const img=new Image(); img.onload=()=>{const c=document.createElement('canvas'); let w=img.width,h=img.height; const max=600; if(w>h){if(w>max){h*=max/w; w=max;}} else {if(h>max){w*=max/h; h=max;}} c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>res(b),'image/jpeg',0.5);}; img.src=e.target.result;}; r.readAsDataURL(file);});}
function setMethode(m){methodeChoisi=m; document.getElementById('depotBox').classList.toggle('hidden', m!=='depot_momo');}
function showV(t){document.querySelectorAll('[id^="v-"]').forEach(e=>e.classList.add('hidden'));document.getElementById('v-'+t).classList.remove('hidden');document.querySelectorAll('.vtab').forEach(e=>e.className="vtab bg-zinc-900 px-3 py-2 rounded-full");document.getElementById('vb'+t.charAt(0).toUpperCase()+t.slice(1)).className="vtab bg-white text-black px-3 py-2 rounded-full font-bold"; if(t==='annonces') loadAnnonces(); if(t==='projets') loadProjets(); if(t==='messages') loadMessages(); if(t==='rapport') loadRapports(); if(t==='support') loadSupport();}
async function login(){const code=document.getElementById('codeInput').value.trim().toUpperCase(); if(!code) return alert("Mets ton code"); const {data,error}=await supa.from('corbeau_users').select('*').eq('code_vendeur',code).maybeSingle(); if(error) return alert(error.message); if(!data) return alert("Code "+code+" introuvable"); currentUser=data; document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); document.getElementById('userName').innerText=data.prenom+" "+data.nom; document.getElementById('userCode').innerText=data.code_vendeur+" - "+data.statut_verif; document.getElementById('userSolde').innerText=(data.solde||0)+"F"; const box=document.getElementById('statusBox'); box.innerText=data.statut_verif==='verifie'?'✅ Vérifié - Tu peux vendre':'⏳ En attente Boss - Tu ne peux pas encore vendre'; box.className=data.statut_verif==='verifie'?"rounded-2xl p-3 mb-3 text-sm text-center bg-green-500/20 text-green-400":"rounded-2xl p-3 mb-3 text-sm text-center bg-yellow-500/20 text-yellow-400"; loadProducts(); loadMyOrders();}
async function register(){const prenom=document.getElementById('prenom').value.trim(), nom=document.getElementById('nom').value.trim(), age=document.getElementById('age').value, classe=document.getElementById('classe').value.trim(), whatsapp=document.getElementById('whatsapp').value.trim(), f1=document.getElementById('fileCNI').files[0], f2=document.getElementById('fileVisage').files[0], btn=document.getElementById('btnRegister'), msg=document.getElementById('registerMsg'); if(!prenom||!nom||!whatsapp||!f1||!f2){msg.innerText="❌ Remplis tout + 2 photos"; return;} btn.innerText="Compression..."; btn.disabled=true; try{const code="CRB"+Math.floor(1000+Math.random()*9000); const b1=await compressToBlob(f1); const b2=await compressToBlob(f2); btn.innerText="Upload 1/2..."; const p1=`${code}_cni.jpg`; let {error:e1}=await supa.storage.from('corbeau-photos').upload(p1,b1,{upsert:true}); if(e1) throw e1; btn.innerText="Upload 2/2..."; const p2=`${code}_visage.jpg`; let {error:e2}=await supa.storage.from('corbeau-photos').upload(p2,b2,{upsert:true}); if(e2) throw e2; const url1=supa.storage.from('corbeau-photos').getPublicUrl(p1).data.publicUrl; const url2=supa.storage.from('corbeau-photos').getPublicUrl(p2).data.publicUrl; btn.innerText="Enregistrement..."; const {error}=await supa.from('corbeau_users').insert({code_vendeur:code,prenom,nom,age:parseInt(age)||18,classe,whatsapp,photo_cni:url1,photo_visage:url2,statut_verif:'en_attente',solde:0}); if(error) throw error; msg.innerHTML=`✅ <b>INSCRIT!</b> Code: ${code}<br>En attente vérif Boss`; document.getElementById('codeInput').value=code; btn.innerText="S'inscrire"; btn.disabled=false; alert("✅ INSCRIT! Code: "+code+"\nEnvoie ce code au Boss!");} catch(e){msg.innerText="❌ Erreur: "+e.message; btn.innerText="S'inscrire"; btn.disabled=false;}}
async function loadProducts(){const {data}=await supa.from('corbeau_products').select('*'); document.getElementById('products').innerHTML=(data||[]).map(p=>`<div class="bg-zinc-900 rounded-2xl p-3"><p class="font-bold text-sm">${p.nom}</p><p class="text-xs text-zinc-500">${p.prix}F - Stock ${p.stock||0}</p><button onclick="commander('${p.id}','${p.nom}')" class="mt-2 w-full bg-white text-black py-2 rounded-full font-bold text-xs">Commander</button></div>`).join('')||"Pas de produits";}
async function loadAnnonces(){const {data}=await supa.from('corbeau_annonces').select('*').order('created_at',{ascending:false}); document.getElementById('listAnnoncesV').innerHTML=(data||[]).map(a=>`<div class="bg-zinc-900 p-3 rounded-2xl"><p class="font-bold text-sm">${a.titre}</p><p class="text-xs text-zinc-400">${a.contenu}</p></div>`).join('')||"Pas d'annonces";}
async function loadProjets(){const {data}=await supa.from('corbeau_projets').select('*').order('created_at',{ascending:false}); document.getElementById('listProjetsV').innerHTML=(data||[]).map(p=>`<div class="bg-zinc-900 p-3 rounded-2xl"><p class="font-bold text-sm">${p.titre}</p><p class="text-xs text-zinc-400">${p.description}</p></div>`).join('')||"Pas de projets";}
async function loadMessages(){if(!currentUser) return; const {data}=await supa.from('corbeau_messages').select('*').eq('vendeur_code',currentUser.code_vendeur).order('created_at',{ascending:false}); document.getElementById('listMessagesV').innerHTML=(data||[]).map(m=>`<div class="bg-zinc-900 p-3 rounded-2xl"><p class="text-xs text-zinc-500">${m.admin_nom||'Boss'}</p><p class="text-sm">${m.message}</p></div>`).join('')||"Pas de messages";}
async function loadMyOrders(){if(!currentUser) return; const {data}=await supa.from('corbeau_commandes').select('*').eq('vendeur_code',currentUser.code_vendeur).order('created_at',{ascending:false}).limit(5); document.getElementById('myOrders').innerHTML=(data||[]).map(o=>`<div class="bg-zinc-900 p-2 rounded-xl text-xs">${o.produit_nom} - ${o.statut}</div>`).join('');}
async function loadRapports(){if(!currentUser) return; const {data}=await supa.from('corbeau_rapports').select('*').eq('vendeur_code',currentUser.code_vendeur).order('created_at',{ascending:false}); document.getElementById('listRapportsV').innerHTML=(data||[]).map(r=>`<div class="bg-zinc-900 p-2 rounded-xl text-xs">${r.ventes_jour} ventes - ${r.total_encaisse}F - ${r.statut}</div>`).join('');}
async function loadSupport(){if(!currentUser) return; const {data}=await supa.from('corbeau_support').select('*').eq('vendeur_code',currentUser.code_vendeur).order('created_at',{ascending:false}); document.getElementById('listSupportV').innerHTML=(data||[]).map(s=>`<div class="bg-zinc-900 p-2 rounded-xl text-xs"><b>${s.sujet}</b> - ${s.statut}<br>${s.message}</div>`).join('');}
async function commander(id,nom){if(!currentUser) return alert("Connecte-toi"); if(currentUser.statut_verif!=='verifie') return alert("Pas vérifié!"); await supa.from('corbeau_commandes').insert({vendeur_code:currentUser.code_vendeur,produit_id:id,produit_nom:nom,statut:'en_attente'}); alert("Commande "+nom+" envoyée!"); loadMyOrders();}
async function envoyerRapport(){if(!currentUser) return; const ventes=parseInt(document.getElementById('rVentes').value)||0, total=parseInt(document.getElementById('rTotal').value)||0, averser=parseInt(document.getElementById('rAverser').value)||0, macom=parseInt(document.getElementById('rMaCom').value)||0, transac=document.getElementById('rTransac').value; await supa.from('corbeau_rapports').insert({vendeur_code:currentUser.code_vendeur,vendeur_nom:currentUser.prenom,ventes_jour:ventes,total_encaisse:total,a_verser_plateforme:averser,ma_commission:macom,methode:methodeChoisi||'confirmation_directe',transaction_id:transac,statut:'en_attente'}); alert("Versé! Boss va confirmer"); loadRapports();}
async function envoyerSupport(){if(!currentUser) return; const sujet=document.getElementById('supportSujet').value, message=document.getElementById('supportMessage').value; await supa.from('corbeau_support').insert({vendeur_code:currentUser.code_vendeur,vendeur_nom:currentUser.prenom,sujet,message,statut:'ouvert'}); alert("Envoyé!"); loadSupport();}
</script></body></html>
