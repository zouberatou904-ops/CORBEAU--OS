<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORBEAU</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white min-h-screen">
<div class="max-w-md mx-auto p-5">
<h1 class="text-4xl font-black mt-6">🦅 CORBEAU</h1>
<p class="text-zinc-500 mb-6">Gagne avec ton téléphone</p>

<div id="step1" class="bg-zinc-900 rounded-[22px] p-5">
<h2 class="font-bold mb-4">Créer ton compte</h2>
<input id="nom" placeholder="Nom" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2">
<input id="prenom" placeholder="Prénom" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2">
<input id="age" type="number" placeholder="Âge" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2">
<input id="classe" placeholder="Classe (ex: Tle D)" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2">
<input id="whatsapp" placeholder="WhatsApp (97...)" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-4">
<button onclick="inscrire()" class="w-full bg-white text-black font-black py-3 rounded-xl">Continuer →</button>
</div>

<div id="step2" class="hidden bg-zinc-900 rounded-[22px] p-5">
<h2 class="font-bold mb-2">Vérification d'identité</h2>
<p class="text-sm text-zinc-500 mb-4">CNI / Carte scolaire + Selfie</p>
<label class="text-sm">📸 Photo CNI / Carte scolaire</label>
<input type="file" id="photoCni" accept="image/*" class="w-full mt-1 mb-3 bg-black border border-zinc-800 rounded-xl p-3">
<img id="prevCni" class="hidden w-full rounded-xl mb-3">
<label class="text-sm">🤳 Photo de ton visage</label>
<input type="file" id="photoVisage" accept="image/*" class="w-full mt-1 mb-3 bg-black border border-zinc-800 rounded-xl p-3">
<img id="prevVisage" class="hidden w-full rounded-xl mb-3">
<button onclick="envoyerVerif()" class="w-full bg-white text-black font-black py-3 rounded-xl">Envoyer pour vérification</button>
</div>

<div id="step3" class="hidden bg-zinc-900 rounded-[22px] p-6 text-center">
<div class="text-5xl">⏳</div>
<h2 class="font-black text-xl mt-3">En attente de vérification</h2>
<p class="text-zinc-400 text-sm mt-2">Le Boss vérifie tes photos. Actualise dans 2 min.</p>
<p id="codeAttente" class="mt-4 font-mono bg-black p-2 rounded-xl"></p>
<button onclick="location.reload()" class="mt-4 w-full border border-zinc-700 py-2 rounded-xl">Actualiser</button>
</div>

<div id="dash" class="hidden">
<div class="bg-zinc-900 rounded-[20px] p-5 mb-4"><p class="text-xs text-zinc-500">TON CODE VENDEUR</p><p id="dCode" class="text-3xl font-black tracking-widest"></p><p id="dSolde" class="mt-2 font-bold"></p></div>
<div class="grid grid-cols-2 gap-3 mb-6"><div class="bg-white text-black rounded-[18px] p-4"><p class="text-xs">Mes Ventes</p><p id="dVentes" class="text-2xl font-black">0</p></div><div class="bg-zinc-900 rounded-[18px] p-4"><p class="text-xs text-zinc-500">Commission</p><p class="text-2xl font-black" id="dComm">0 F</p></div></div>
<h3 class="font-bold mb-3">Produits à vendre</h3>
<div id="produits" class="space-y-3"></div>
<button onclick="localStorage.clear();location.reload()" class="mt-8 text-xs text-zinc-600 underline w-full">Déconnexion</button>
</div>

</div>
<script>
const SUPA_URL = "https://nmkpanyeswafuchmvclj.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ta3Bhbnllc3dhZnVjaG12Y2xqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTcxNTIsImV4cCI6MjEwNTkzMzE1Mn0.fleM-nhlLGteYjbdmWIlkzsgQS-zs3cf38-hTVBiKm8";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
let b64Cni="", b64Visage="";
function toB64(file,cb){const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(file);}
document.getElementById('photoCni').onchange=e=>{toB64(e.target.files[0],b=>{b64Cni=b;document.getElementById('prevCni').src=b;document.getElementById('prevCni').classList.remove('hidden');})}
document.getElementById('photoVisage').onchange=e=>{toB64(e.target.files[0],b=>{b64Visage=b;document.getElementById('prevVisage').src=b;document.getElementById('prevVisage').classList.remove('hidden');})}

async function inscrire(){
 const nom=document.getElementById('nom').value, prenom=document.getElementById('prenom').value, age=document.getElementById('age').value, classe=document.getElementById('classe').value, whatsapp=document.getElementById('whatsapp').value;
 if(!nom||!prenom||!whatsapp) return alert("Remplis tout Boss");
 const code="CRB"+Math.floor(1000+Math.random()*9000);
 const {data,error}=await supa.from('corbeau_users').insert({nom,prenom,age:parseInt(age)||0,classe,whatsapp,code_vendeur:code,solde:0,statut_verif:'a_verifier',photo_cni:'',photo_visage:''}).select().single();
 if(error) return alert(error.message);
 localStorage.setItem('corbeau_code',code);
 document.getElementById('step1').classList.add('hidden'); document.getElementById('step2').classList.remove('hidden');
}
async function envoyerVerif(){
 if(!b64Cni||!b64Visage) return alert("Ajoute les 2 photos Boss");
 const code=localStorage.getItem('corbeau_code');
 const {error}=await supa.from('corbeau_users').update({photo_cni:b64Cni,photo_visage:b64Visage,statut_verif:'en_attente'}).eq('code_vendeur',code);
 if(error) return alert(error.message);
 document.getElementById('step2').classList.add('hidden'); document.getElementById('step3').classList.remove('hidden'); document.getElementById('codeAttente').innerText=code;
}
async function load(){
 const code=localStorage.getItem('corbeau_code'); if(!code) return;
 const {data:u}=await supa.from('corbeau_users').eq('code_vendeur',code).single(); if(!u) return;
 if(u.statut_verif==='a_verifier'){document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');}
 else if(u.statut_verif==='en_attente'){document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.add('hidden');document.getElementById('step3').classList.remove('hidden');document.getElementById('codeAttente').innerText=u.code_vendeur;}
 else if(u.statut_verif==='verifie'){document.getElementById('step1').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');document.getElementById('dCode').innerText=u.code_vendeur;document.getElementById('dSolde').innerText="Solde: "+(u.solde||0)+" F";
  const prods=[{n:"Formation Canva Pro",p:5000,c:2000},{n:"Pack 1000 Templates",p:3000,c:1500},{n:"Formation IA 2026",p:10000,c:4000}];
  document.getElementById('produits').innerHTML=prods.map(x=>`<div class="bg-zinc-900 p-4 rounded-2xl flex justify-between items-center"><div><p class="font-bold">${x.n}</p><p class="text-xs text-zinc-500">${x.p}F → Toi: ${x.c}F</p></div><button onclick="vendre('${x.n}',${x.p},${x.c})" class="bg-white text-black px-4 py-1 rounded-full font-bold text-sm">Vendre</button></div>`).join('');
 }
}
async function vendre(nom,prix,comm){const cn=prompt("Nom du client"), cw=prompt("WhatsApp client"); if(!cn) return; const code=localStorage.getItem('corbeau_code'); const {data:u}=await supa.from('corbeau_users').eq('code_vendeur',code).single(); await supa.from('corbeau_orders').insert({produit_nom:nom,prix,commission:comm,client_nom:cn,client_whatsapp:cw,vendeur_code:code,vendeur_nom:u.nom,statut:'en_attente'}); alert("Commande envoyée au Boss!");}
load();
</script>
</body>
 </html>
