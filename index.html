<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Corbeau — Inscription</title>

  <meta
    name="description"
    content="Inscription à Corbeau, la plateforme qui permet de développer son activité commerciale."
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070707;
      --card: #111111;
      --card2: #171717;
      --border: #292929;
      --text: #ffffff;
      --muted: #a5a5a5;
      --purple: #8b5cf6;
      --purple2: #6d28d9;
      --green: #22c55e;
      --red: #ef4444;
      --gold: #f5c451;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(139, 92, 246, 0.18),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      padding: 20px 14px 40px;
    }

    .page {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    /* =========================
       LOGO
    ========================= */

    .brand {
      text-align: center;
      margin: 10px 0 25px;
    }

    .logo-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          #1d1d1d,
          #090909
        );

      border: 1px solid #333;

      box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 40px rgba(139,92,246,.12);
    }

    .logo-svg {
      width: 75px;
      height: 75px;
    }

    .brand-name {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .brand-name span {
      color: var(--purple);
    }

    .tagline {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       INTRO
    ========================= */

    .intro {
      text-align: center;
      margin-bottom: 22px;
    }

    .intro h1 {
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1.08;
      margin-bottom: 10px;
    }

    .intro p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.015)
        ),
        var(--card);

      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.45);
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-box {
      margin-bottom: 25px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .progress {
      height: 6px;
      background: #252525;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 25%;
      background: linear-gradient(
        90deg,
        var(--purple),
        #a78bfa
      );
      border-radius: 20px;
      transition: .3s;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-bottom: 27px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 15px;
    }

    .section-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(139,92,246,.16);
      color: #c4b5fd;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid rgba(139,92,246,.3);
    }

    .section-title {
      font-size: 19px;
      font-weight: 800;
    }

    /* =========================
       INPUTS
    ========================= */

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: #e5e5e5;
      font-size: 13px
