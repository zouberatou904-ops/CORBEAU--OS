<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#050608">
  <meta name="description" content="Corbeau — Une opportunité à portée de main">

  <title>Corbeau — Inscription</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050608;
      color: #f1f3f5;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* =========================
       FOND
    ========================= */

    body::before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      top: -220px;
      right: -180px;
      background: #f5bd25;
      opacity: 0.08;
      filter: blur(100px);
      border-radius: 50%;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 350px;
      height: 350px;
      bottom: -180px;
      left: -180px;
      background: #f5bd25;
      opacity: 0.05;
      filter: blur(100px);
      border-radius: 50%;
      pointer-events: none;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px 22px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 50%;

      background: #f5bd25;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #050608;
      font-size: 29px;
      font-weight: 900;

      box-shadow:
        0 0 0 1px rgba(245,189,37,.3),
        0 8px 30px rgba(245,189,37,.15);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 6px;
    }

    .brand-slogan {
      margin-top: 4px;
      color: #929aa5;
      font-size: 12px;
    }

    .step-counter {
      padding: 10px 16px;
      border-radius: 30px;

      background: #0d1117;
      border: 1px solid #303742;

      color: #f5bd25;
      font-weight: 800;
      font-size: 14px;
    }

    /* =========================
       CONTENU
    ========================= */

    .container {
      width: 100%;
      max-width: 1050px;
      margin: auto;
      padding: 35px 22px 60px;
    }

    .intro {
      margin-bottom: 30px;
    }

    .eyebrow {
      color: #f5bd25;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    .intro h1 {
      font-size: clamp(40px, 7vw, 68px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .intro h1 span {
      color: #f5bd25;
    }

    .intro p {
      max-width: 720px;
      color: #aeb6c2;
      font-size: 18px;
      line-height: 1.6;
    }

    /* =========================
       PROGRESSION
    ========================= */

    .progress-container {
      width: 100%;
      height: 7px;

      background: #171c23;
      border-radius: 20px;

      overflow: hidden;
      margin-bottom: 30px;
    }

    .progress {
      width: 11.11%;
      height: 100%;

      background: #f5bd25;

      border-radius: 20px;

      transition: width .3s ease;
    }

    /* =========================
       CARTE
    ========================= */

    .card {
      background:
        linear-gradient(
          145deg,
          #10151c,
          #090c11
        );

      border: 1px solid #29313b;

      border-radius: 24px;

      padding: 30px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.25);
    }

    .step-title {
      display: flex;
      align-items: center;
      gap: 16px;

      margin-bottom: 25px;
    }

    .step-number {
      width: 55px;
      height: 55px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f5bd25;
      color: #111;

      border-radius: 16px;

      font-size: 18px;
      font-weight: 900;
    }

    .step-title h2 {
      font-size: 26px;
      margin-bottom: 5px;
    }

    .step-title p {
      color: #929ba7;
      font-size: 14px;
    }

    .separator {
      height: 1px;
      background: #252c35;
      margin-bottom: 25px;
    }

    /* =========================
       FORMULAIRE
    ========================= */

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: #e5e8ec;
      font-size: 14px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;

      padding: 15px;

      background: #0b1016;
      color: #f1f3f5;

      border: 1px solid #35404b;
      border-radius: 13px;

      outline: none;

      font-size: 16px;

      transition: .2s;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #68727f;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #f5bd25;

      box-shadow:
        0 0 0 3px rgba(245,189,37,.09);
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions {
      display: flex;
      gap: 15px;

      margin-top: 22px;
    }

    .button {
      flex: 1;

      padding: 16px;

      border-radius: 14px;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;

      transition: .2s;
    }

    .button-back {
      background: #10151c;
      color: #f1f3f5;

      border: 1px solid #343d48;
    }

    .button-next {
      background: linear-gradient(
        90deg,
        #ffd34b,
        #efad10
      );

      color: #111;

      border: none;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;

      padding: 35px 20px;

      color: #606a77;

      font-size: 11px;

      letter-spacing: 3px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .header {
        padding: 16px;
      }

      .logo {
        width: 50px;
        height: 50px;
        font-size: 25px;
      }

      .brand-name {
        font-size: 18px;
        letter-spacing: 4px;
      }

      .brand-slogan {
        font-size: 10px;
      }

      .step-counter {
        padding: 9px 13px;
      }

      .container {
        padding: 25px 15px 45px;
      }

      .intro h1 {
        font-size: 46px;
      }

      .intro p {
        font-size: 16px;
      }

      .card {
        padding: 21px 17px;
        border-radius: 20px;
      }

      .step-title h2 {
        font-size: 22px;
      }

      .fields {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .actions {
        position: sticky;
        bottom: 0;

        padding: 12px 0;

        background: rgba(5,6,8,.94);

        backdrop-filter: blur(12px);

        z-index: 20;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <div class="logo">
        C
      </div>

      <div>
        <div class="brand-name">
          CORBEAU
        </div>

        <div class="brand-slogan">
          Une opportunité à portée de main
        </div>
      </div>

    </div>

    <div class="step-counter">
      <span id="stepNumber">1</span> / 9
    </div>

  </header>


  <!-- CONTENU -->

  <main class="container">

    <section class="intro">

      <div class="eyebrow">
        CRÉER MON COMPTE
      </div>

      <h1>
        Bienvenue dans
        <span>Corbeau.</span>
      </h1>

      <p>
        Inscris-toi pour rejoindre la plateforme
        et commencer à découvrir les opportunités
        proposées par Corbeau.
      </p>

    </section>


    <!-- PROGRESSION -->

    <div class="progress-container">
      <div class="progress" id="progress"></div>
    </div>


    <!-- CARTE INSCRIPTION -->

    <div class="card">

      <div class="step-title">

        <div class="step-number">
          01
        </div>

        <div>
          <h2>
            Informations personnelles
          </h2>

          <p>
            Commençons par créer ton profil.
          </p>
        </div>

      </div>


      <div class="separator"></div>


      <!-- ÉTAPE 1 -->

      <div id="step1">

        <div class="fields">

          <div class="field">

            <label>
              Prénom *
            </label>

            <input
              type="text"
              placeholder="Ex. Sabirou"
            >

          </div>


          <div class="field">

            <label>
              Nom *
            </label>

            <input
              type="text"
              placeholder="Ex. Tairou"
            >

          </div>


          <div class="field">

            <label>
              Date de naissance *
            </label>

            <input
              type="date"
            >

          </div>


          <div class="field">

            <label>
              Numéro de téléphone *
            </label>

            <input
              type="tel"
              placeholder="+229 XX XX XX XX"
            >

          </div>


          <div class="field">

            <label>
              Ville *
            </label>

            <input
              type="text"
              placeholder="Ex. Abomey-Calavi"
            >

          </div>


          <div class="field">

            <label>
              Adresse e-mail *
            </label>

            <input
              type="email"
              placeholder="ton@email.com"
            >

          </div>

        </div>

      </div>


      <!-- ACTIONS -->

      <div class="actions">

        <button
          type="button"
          class="button button-back"
          id="backButton"
          disabled
        >
          ← Retour
        </button>

        <button
          type="button"
          class="button button-next"
          id="nextButton"
        >
          Continuer →
        </button>

      </div>

    </div>

  </main>


  <footer class="footer">
    CORBEAU — PLATEFORME D'OPPORTUNITÉS
  </footer>


  <script>

    let currentStep = 1;

    const totalSteps = 9;

    const stepNumber =
      document.getElementById("stepNumber");

    const progress =
      document.getElementById("progress");

    const nextButton =
      document.getElementById("nextButton");

    const backButton =
      document.getElementById("backButton");


    function updateProgress() {

      stepNumber.textContent =
        currentStep;

      const percentage =
        (currentStep / totalSteps) * 100;

      progress.style.width =
        percentage + "%";

    }


    nextButton.addEventListener(
      "click",
      function () {

        if (currentStep < totalSteps) {

          currentStep++;

          updateProgress();

          /*
           * Pour l'instant nous affichons
           * l'étape suivante visuellement.
           * Les 9 écrans seront ajoutés
           * dans la prochaine version.
           */

          alert(
            "Étape " +
            currentStep +
            " / 9 — nous allons maintenant construire cet écran."
          );

        }

      }
    );


    backButton.addEventListener(
      "click",
      function () {

        if (currentStep > 1) {

          currentStep--;

          updateProgress();

        }

      }
    );


    updateProgress();

  </script>

</body>
              </html>
