<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CORBEAU — Inscription</title>
<style>
:root{
  --bg:#08070d;--panel:#11101a;--panel2:#171522;--line:#302b40;
  --purple:#9a5cff;--purple2:#7138e8;--text:#fff;--muted:#aaa6b7;
  --danger:#ff6b7a;--ok:#61e294;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#211239 0,#0b0910 38%,#050508 100%);
color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}
.app{width:100%;max-width:760px;margin:auto;min-height:100vh;padding:18px 18px 34px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;letter-spacing:.3px}
.logo{width:48px;height:48px;border-radius:15px;background:#0d0b14;border:1px solid #3c285e;display:grid;place-items:center;box-shadow:0 0 30px #6e36cc33}
.logo svg{width:32px;height:32px}
.secure{font-size:12px;color:#bcb7ca;background:#15121e;border:1px solid var(--line);padding:8px 10px;border-radius:999px}
.progressWrap{background:#13111b;border:1px solid #272332;border-radius:18px;padding:12px 13px;margin-bottom:18px}
.progressTop{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.bar{height:7px;background:#292532;border-radius:99px;overflow:hidden}
.fill{height:100%;width:11.11%;background:linear-gradient(90deg,var(--purple2),var(--purple));border-radius:99px;transition:.25s}
.hero{text-align:center;padding:12px 0 22px}
.hero .bigLogo{width:92px;height:92px;border-radius:28px;background:#0d0b14;border:1px solid #4a3170;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 0 55px #8d4eff22}
.hero .bigLogo svg{width:62px;height:62px}
h1{font-size:34px;line-height:1.08;margin:0 0 10px;font-weight:900;letter-spacing:-1px}
.hero p{margin:0;color:var(--muted);font-size:16px;line-height:1.55}
.card{background:linear-gradient(180deg,#15131d,#100f17);border:1px solid #302b3b;border-radius:25px;padding:22px;box-shadow:0 18px 55px #0007}
.stepTitle{font-size:25px;font-weight:900;margin:0 0 7px}
.stepSub{color:var(--muted);margin:0 0 20px;line-height:1.5}
label{display:block;font-size:14px;font-weight:750;margin:15px 0 8px}
input,select{width:100%;background:#0c0b10;color:#fff;border:1px solid #383343;border-radius:14px;padding:14px 15px;outline:none}
input:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9a5cff18}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:1px solid #393344;background:#0d0c12;border-radius:17px;padding:17px;text-align:left;cursor:pointer;transition:.2s}
.choice strong{display:block;font-size:16px;margin-bottom:5px}.choice span{color:var(--muted);font-size:13px;line-height:1.4}
.choice.active{border-color:var(--purple);background:#1b1229;box-shadow:0 0 0 2px #9a5cff22}
.notice{border:1px solid #3a3347;background:#17141f;border-radius:16px;padding:14px;color:#c0bacb;font-size:13px;line-height:1.55;margin-top:16px}
.notice b{color:#fff}
.actions{display:flex;gap:10px;margin-top:22px}
.btn{border:0;border-radius:15px;padding:15px 18px;font-weight:850;cursor:pointer}
.primary{flex:1;color:#fff;background:linear-gradient(135deg,#a35cff,#7036e8);box-shadow:0 10px 30px #7b3ee83a}
.secondary{background:#191721;color:#ddd;border:1px solid #393343}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fileBox{border:1px dashed #514a60;background:#0c0b10;border-radius:18px;padding:18px;text-align:center}
.fileBox input{display:none}.fileBtn{display:inline-block;padding:12px 16px;background:#1a1623;border:1px solid #443b52;border-radius:12px;cursor:pointer;font-weight:750}
.preview{max-width:100%;max-height:190px;border-radius:14px;margin-top:14px;display:none}
.summary{display:grid;gap:9px;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:15px;padding:12px;border-radius:12px;background:#0c0b10;border:1px solid #292531}
.row span:first-child{color:var(--muted)}.row span:last-child{text-align:right;font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;color:#c9c4d1;font-size:13px;line-height:1.45}
.check input{width:19px;height:19px;accent-color:var(--purple);margin-top:1px}
.success{text-align:center;padding:22px 5px}
.successIcon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:#14301e;border:1px solid #2b6d43;color:var(--ok);font-size:38px}
.small{font-size:12px;color:#888394;text-align:center;margin-top:16px}
.hidden{display:none!important}
@media(max-width:560px){.app{padding:14px 13px 28px}.card{padding:18px;border-radius:22px}h1{font-size:31px}.grid,.choiceGrid{grid-template-columns:1fr}.secure{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-label="Logo Corbeau">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path fill="#a65cff" d="M18 61c17-2 25-15 25-31 9 7 15 17 15 29 8-7 17-9 25-6-6 15-20 27-38 28-12 1-21-5-27-20Z"/><path fill="#fff" d="M45 30c5-6 10-12 17-15-2 10 1 18 7 24-7-1-15 1-22 7 1-6 0-11-2-16Z"/></svg>
      </div>
      CORBEAU
    </div>
    <div class="secure">🔒 Inscription sécurisée</div>
  </header>

  <div class="progressWrap" id="progressWrap">
    <div class="progressTop"><span id="progressText">Étape 1 sur 9</span><span id="percent">11%</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <main id="app"></main>
  <p class="small">CORBEAU • Crée ton compte pour accéder à la plateforme</p>
</div>

<script>
const state={
 step:1,
 data:{},
 files:{},
 type:""
};

const app=document.getElementById("app");
const fill=document.getElementById("fill");
const progressText=document.getElementById("progressText");
const percent=document.getElementById("percent");

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function updateProgress(){
 const p=Math.round(state.step/9*100);
 fill.style.width=p+"%";percent.textContent=p+"%";progressText.textContent=state.step===9?"Dernière étape":"Étape "+state.step+" sur 9";
}
function shell(title,sub,body){
 return `<section class="card"><h2 class="stepTitle">${title}</h2><p class="stepSub">${sub}</p>${body}</section>`;
}
function actions(next=true){
 return `<div class="actions">${state.step>1?'<button class="btn secondary" onclick="prev()">← Retour</button>':''}${next?'<button class="btn primary" onclick="next()">Continuer →</button>':''}</div>`;
}
function render(){
 updateProgress();
 let content="";
 if(state.step===1) content=`
   <div class="hero">
    <div class="bigLogo"><svg viewBox="0 0 100 100"><path fill="#a65cff" d="M18 61c17-2 25-15 25-31 9 7 15 17 15 29 8-7 17-9 25-6-6 15-20 27-38 28-12 1-21-5-27-20Z"/><path fill="#fff" d="M45 30c5-6 10-12 17-15-2 10 1 18 7 24-7-1-15 1-22 7 1-6 0-11-2-16Z"/></svg></div>
    <h1>Bienvenue sur<br>Corbeau</h1><p>Crée ton compte en quelques étapes simples et commence ton parcours.</p>
   </div>
   ${shell("Prêt à commencer ?","Nous allons te demander quelques informations pour créer ton profil.",`
     <div class="notice"><b>À savoir :</b> certaines informations et pièces justificatives peuvent être sensibles. Elles devront être protégées lors du stockage final.</div>
     <div class="actions"><button class="btn primary" onclick="next()">Commencer mon inscription →</button></div>
   `)}
 `;
 if(state.step===2) content=shell("Informations personnelles","Commençons par ton identité.",`
   <div class="grid">
    <div><label>Prénom *</label><input id="prenom" placeholder="Ton prénom" value="${esc(state.data.prenom)}"></div>
    <div><label>Nom *</label><input id="nom" placeholder="Ton nom" value="${esc(state.data.nom)}"></div>
   </div>
   <label>Date de naissance *</label><input id="naissance" type="date" value="${esc(state.data.naissance)}">
   ${actions()}
 `);
 if(state.step===3) content=shell("Contact","Ajoute tes coordonnées pour pouvoir sécuriser ton compte.",`
   <label>Téléphone *</label><input id="telephone" type="tel" placeholder="+229 XX XX XX XX" value="${esc(state.data.telephone)}">
   <label>Email *</label><input id="email" type="email" placeholder="exemple@email.com" value="${esc(state.data.email)}">
   <div class="notice">Ton numéro et ton email serviront notamment à la récupération du compte.</div>
   ${actions()}
 `);
 if(state.step===4) content=shell("Ton parcours","Dis-nous quel profil correspond à ton inscription.",`
   <div class="choiceGrid">
    <button class="choice ${state.type==='eleve'?'active':''}" onclick="chooseType('eleve')"><strong>🎓 Élève</strong><span>Je suis élève / étudiant.</span></button>
    <button class="choice ${state.type==='adulte'?'active':''}" onclick="chooseType('adulte')"><strong>💼 Adulte</strong><span>Je suis un adulte.</span></button>
   </div>
   <label>Ville *</label><input id="ville" placeholder="Ex : Abomey-Calavi" value="${esc(state.data.ville)}">
   ${actions()}
 `);
 if(state.step===5) content=shell("Pièce justificative","Sélectionne le document demandé pour ton profil.",`
   <div class="notice"><b>Élève :</b> carte scolaire. &nbsp; <b>Adulte :</b> CNI ou document d'identité accepté.</div>
   <label>Type de document *</label>
   <select id="docType">
    <option value="">Choisir</option>
    <option value="CNI" ${state.data.docType==='CNI'?'selected':''}>CNI</option>
    <option value="Carte scolaire" ${state.data.docType==='Carte scolaire'?'selected':''}>Carte scolaire</option>
   </select>
   <label>Photo du document *</label>
   <div class="fileBox"><label class="fileBtn" for="docFile">📷 Choisir une photo</label><input id="docFile" type="file" accept="image/*" onchange="pickFile('docFile','docPreview','doc')"><img id="docPreview" class="preview"></div>
   ${state.files.doc?'<div class="notice">✓ Document sélectionné : '+esc(state.files.doc.name)+'</div>':''}
   ${actions()}
 `);
 if(state.step===6) content=shell("Ta photo","Ajoute une photo nette pour ton profil.",`
   <div class="fileBox"><label class="fileBtn" for="photoFile">📷 Choisir ma photo</label><input id="photoFile" type="file" accept="image/*" capture="user" onchange="pickFile('photoFile','photoPreview','photo')"><img id="photoPreview" class="preview"></div>
   ${state.files.photo?'<div class="notice">✓ Photo sélectionnée : '+esc(state.files.photo.name)+'</div>':''}
   <div class="notice">Utilise une photo claire, avec ton visage visible.</div>
   ${actions()}
 `);
 if(state.step===7) content=shell("Sécurise ton compte","Crée un mot de passe difficile à deviner.",`
   <label>Mot de passe *</label><input id="password" type="password" placeholder="Au moins 8 caractères">
   <label>Confirmer le mot de passe *</label><input id="password2" type="password" placeholder="Retape ton mot de passe">
   <div class="notice">Conseil : utilise un mot de passe unique avec lettres, chiffres et caractères spéciaux.</div>
   ${actions()}
 `);
 if(state.step===8) content=shell("Vérifie tes informations","Regarde une dernière fois avant de créer ton compte.",`
   <div class="summary">
    ${row("Nom",`${state.data.prenom||""} ${state.data.nom||""}`)}
    ${row("Naissance",state.data.naissance)}
    ${row("Téléphone",state.data.telephone)}
    ${row("Email",state.data.email)}
    ${row("Profil",state.type==='eleve'?'Élève':'Adulte')}
    ${row("Ville",state.data.ville)}
    ${row("Document",state.data.docType)}
    ${row("Pièces",`${state.files.doc?'Document ✓':'Document —'} / ${state.files.photo?'Photo ✓':'Photo —'}`)}
   </div>
   <label class="check"><input id="consent" type="checkbox"> <span>Je confirme que les informations fournies sont exactes et j'accepte les conditions d'utilisation de Corbeau.</span></label>
   <div class="actions"><button class="btn secondary" onclick="prev()">← Modifier</button><button class="btn primary" onclick="finish()">Créer mon compte ✓</button></div>
 `);
 if(state.step===9) content=`
   <section class="card success">
    <div class="successIcon">✓</div>
    <h2 class="stepTitle">Inscription terminée !</h2>
    <p class="stepSub">Ton dossier a été préparé avec succès.</p>
    <div class="notice"><b>Prochaine étape :</b> la connexion à Supabase permettra d'enregistrer réellement le compte et les fichiers de façon sécurisée.</div>
    <div class="actions"><button class="btn primary" onclick="location.reload()">Retour à l'accueil</button></div>
   </section>
 `;
 app.innerHTML=content;
 if(state.step===5 && state.files.doc) showPreview(state.files.doc,"docPreview");
 if(state.step===6 && state.files.photo) showPreview(state.files.photo,"photoPreview");
}
function row(a,b){return `<div class="row"><span>${esc(a)}</span><span>${esc(b||"—")}</span></div>`}
function saveInputs(ids){
 ids.forEach(id=>{const e=document.getElementById(id);if(e)state.data[id]=e.value.trim()});
}
function validateStep(){
 if(state.step===2){saveInputs(["prenom","nom","naissance"]);if(!state.data.prenom||!state.data.nom||!state.data.naissance){alert("Remplis ton prénom, ton nom et ta date de naissance.");return false}}
 if(state.step===3){saveInputs(["telephone","email"]);if(!state.data.telephone||!state.data.email){alert("Remplis ton téléphone et ton email.");return false}}
 if(state.step===4){saveInputs(["ville"]);if(!state.type||!state.data.ville){alert("Choisis ton profil et indique ta ville.");return false}}
 if(state.step===5){const e=document.getElementById("docType");if(e)state.data.docType=e.value;if(!state.data.docType||!state.files.doc){alert("Choisis le type de document et ajoute sa photo.");return false}}
 if(state.step===6&&!state.files.photo){alert("Ajoute ta photo de profil.");return false}
 if(state.step===7){const p=document.getElementById("password")?.value||"",q=document.getElementById("password2")?.value||"";if(p.length<8){alert("Le mot de passe doit contenir au moins 8 caractères.");return false}if(p!==q){alert("Les deux mots de passe ne correspondent pas.");return false}state.data.password=p}
 return true;
}
function next(){if(!validateStep())return;if(state.step<9)state.step++;render();window.scrollTo({top:0,behavior:"smooth"})}
function prev(){if(state.step>1)state.step--;render();window.scrollTo({top:0,behavior:"smooth"})}
function chooseType(t){state.type=t;render()}
function pickFile(inputId,previewId,key){
 const f=document.getElementById(inputId)?.files?.[0];if(!f)return;
 if(f.size>8*1024*1024){alert("Fichier trop volumineux. Maximum 8 Mo.");return}
 state.files[key]=f;showPreview(f,previewId);
}
function showPreview(file,id){
 const img=document.getElementById(id);if(!img)return;
 const r=new FileReader();r.onload=()=>{img.src=r.result;img.style.display="block"};r.readAsDataURL(file);
}
function finish(){
 const c=document.getElementById("consent");if(!c?.checked){alert("Coche la case de confirmation.");return}
 state.step=9;render();window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script>
</body>
</html>
