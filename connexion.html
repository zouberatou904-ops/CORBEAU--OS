<script>
  const SUPABASE_URL = "https://nmkpanyeswafuchmvclj.supabase.co";
  const SUPABASE_ANON_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ta3Bhbnllc3dhZnVjaG12Y2xqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTcxNTIsImV4cCI6MjEwNTkzMzE1Mn0.fleM-nhlLGteYjbdmWIlkzsgQS-zs3cf38-hTVBiKm8";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.innerText = "Connexion en cours...";
    btn.disabled = true;

    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const email = `${phone.replace(/[^0-9]/g, '')}@corbeau.app`;

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    
    if (error) {
      alert("Erreur de connexion : " + error.message);
      btn.innerText = "Se Connecter";
      btn.disabled = false;
      return;
    }

    // Récupération du profil et du statut
    const { data: profile } = await supabase
      .from('profiles')
      .select('role, status')
      .eq('id', data.user.id)
      .single();

    // Redirection selon le statut
    if (profile?.status !== 'actif') {
      window.location.href = 'en-attente.html';
    } else {
      alert("Connexion réussie ! Redirection...");
      if (profile.role === 'fournisseur') window.location.href = 'supplier.html';
      else window.location.href = 'dashboard-vendeur.html';
    }
  });
</script>
